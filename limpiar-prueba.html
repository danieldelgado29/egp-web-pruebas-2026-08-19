<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limpiando prueba EGP</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#111;
  color:#eee;
  font-family:system-ui,sans-serif;
}
main{text-align:center;padding:30px}
strong{display:block;font-size:22px;margin-bottom:12px}
</style>
</head>
<body>
<main>
<strong>Limpiando versión anterior…</strong>
<div id="estado">Espera un momento.</div>
</main>

<script>
(async()=>{
  const estado=document.getElementById("estado");

  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }

    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(
        keys
          .filter(k=>k.startsWith("egm-")||k.startsWith("egm-panel-"))
          .map(k=>caches.delete(k))
      );
    }

    estado.textContent="Limpieza terminada. Abriendo Panel nuevo…";

    setTimeout(()=>{
      location.replace(
        "./panel.html?trusted=1&live=1&fresh="+Date.now()
      );
    },1200);

  }catch(e){
    estado.textContent="Recarga esta página una vez.";
  }
})();
</script>
</body>
</html>
