<script id="egpPortadaDinamica">
(function(){

  function rgba(hex, alpha){
    hex = String(hex || '#000000').replace('#','');

    if(hex.length !== 6)
      return 'rgba(0,0,0,'+alpha+')';

    const n = parseInt(hex,16);

    return 'rgba('+
      (n>>16)+','+
      ((n>>8)&255)+','+
      (n&255)+','+
      alpha+')';
  }


  async function cargarPortada(){

    let sources = {};
    let settings = {};

    try{
      sources =
        JSON.parse(
          localStorage.getItem(
            'egm-photo-originals'
          ) || '{}'
        );

      settings =
        JSON.parse(
          localStorage.getItem(
            'egm-photo-settings'
          ) || '{}'
        );

    }catch(_){}


    const hero =
      document.querySelector('.hero');

    const overlay =
      document.querySelector('.hero-overlay');

    if(!hero) return;


    /*
     * EGP — Fotos compartidas.
     * Primero conserva localStorage como respaldo.
     * Después intenta leer la variante correcta desde Local Core.
     */
    const target =
      window.matchMedia('(max-width:700px)').matches
        ? 'mobile'
        : 'desktop';

    const variantKey='portada__'+target;

    let src =
      sources[variantKey] ||
      sources.portada ||
      '';

    let d =
      settings[variantKey] ||
      settings.portada ||
      {};

    try{
      const coreHost =
        location.hostname === '127.0.0.1' ||
        location.hostname === 'localhost'
          ? '127.0.0.1'
          : location.hostname;

      const response=await fetch(
        'http://'+coreHost+':8898/api/photos',
        {cache:'no-store'}
      );

      if(response.ok){
        const remote=await response.json();
        const photo=remote?.photos?.[variantKey];

        if(photo && typeof photo==='object'){
          if(photo.src) src=photo.src;
          d={...d,...photo};
        }
      }
    }catch(err){
      console.warn(
        'Core de fotos no disponible; usando almacenamiento local',
        err
      );
    }


    /*
     * Si todavía no se configuró:
     * conserva hero.jpg / hero-mobile.jpg.
     */

    if(src){
      hero.style.backgroundImage =
        'url("' + src + '")';
    }


    if(
      d.x !== undefined ||
      d.y !== undefined
    ){
      hero.style.backgroundPosition =
        (d.x ?? 50) + '% ' +
        (d.y ?? 50) + '%';
    }


    if(d.zoom !== undefined){
      hero.style.backgroundSize =
        Number(d.zoom) + '%';
    }


    if(overlay){

      const intensity =
        Number(d.intensity ?? 55) / 100;

      const opacity =
        Number(d.opacity ?? 70) / 100;

      const alpha =
        intensity * opacity;

      const direction =
        d.direction || 'to bottom';

      const color =
        d.color || '#000000';

      overlay.style.background =
        'linear-gradient('+
        direction+','+
        rgba(color,0)+' 0%,'+
        rgba(color,alpha)+' 100%)';
    }
  }


  document.addEventListener(
    'DOMContentLoaded',
    cargarPortada
  );


  window.addEventListener(
    'storage',
    function(e){
      if(
        e.key === 'egm-photo-originals' ||
        e.key === 'egm-photo-settings'
      ){
        cargarPortada();
      }
    }
  );

})();
</script>


<script type="module" id="egpFotoFirebasePublicaTest">
(async function(){

  const params=new URLSearchParams(location.search);

  if(params.get('photos_firebase_test')!=='1'){
    return;
  }

  try{
    const [{initializeApp},{getFirestore,doc,getDoc}] =
      await Promise.all([
        import('https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js')
      ]);

    const response=await fetch(
      '../configuracion.json?fotoFirebase=' + Date.now(),
      {cache:'no-store'}
    );

    const cfg=await response.json();

    const app=initializeApp(
      cfg.firebase,
      'inicio-foto-publica-test'
    );

    const db=getFirestore(app);

    const ref=doc(
      db,
      'imageEdits',
      'site-photo-portada__mobile'
    );

    const snap=await getDoc(ref);

    if(!snap.exists()) return;

    const d=snap.data()||{};
    const hero=document.querySelector('.hero');
    const overlay=document.querySelector('.hero-overlay');

    if(!hero || !d.src) return;

    hero.style.backgroundImage='url("' + d.src + '")';

    hero.style.backgroundPosition=
      (d.x ?? 50) + '% ' +
      (d.y ?? 50) + '%';

    if(d.zoom!==undefined){
      hero.style.backgroundSize=
        Number(d.zoom) + '%';
    }

    if(overlay){
      const hex=String(d.color||'#000000').replace('#','');
      const n=parseInt(hex,16);

      const alpha=
        (Number(d.intensity ?? 55)/100) *
        (Number(d.opacity ?? 70)/100);

      const rgba=a =>
        'rgba('+
        (n>>16)+','+
        ((n>>8)&255)+','+
        (n&255)+','+
        a+')';

      overlay.style.background=
        'linear-gradient('+
        (d.direction||'to bottom')+','+
        rgba(0)+' 0%,'+
        rgba(alpha)+' 100%)';
    }

    console.log(
      'EGP FOTO FIREBASE:',
      'portada__mobile',
      d.updatedAt||''
    );

  }catch(err){
    console.error('EGP FOTO FIREBASE ERROR',err);
  }

})();
</script>
