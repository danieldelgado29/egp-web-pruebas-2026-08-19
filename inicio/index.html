<script>
/*
 * EGP — FOTO INICIO INMEDIATA
 * Usa la última foto Firebase comprobada para evitar mostrar
 * hero.jpg mientras se conecta nuevamente a Firebase.
 */
(function(){
  try{
    const mobile=
      /iPhone|iPad|iPod|Android|Mobile|Windows Phone/i
        .test(navigator.userAgent||'');

    const key='portada__'+(mobile?'mobile':'desktop');

    const saved=JSON.parse(
      localStorage.getItem('egp-firebase-photo-cache')||'{}'
    )[key];

    if(!saved || !saved.src) return;

    document.documentElement.style.setProperty(
      '--egp-inicio-cache',
      'url("' + saved.src + '")'
    );

    document.documentElement.classList.add(
      'egp-inicio-cache-ready'
    );

    window.__EGP_INICIO_CACHE__=saved;

  }catch(_){}
})();
</script>

<style>
html.egp-inicio-cache-ready .hero{
  background-image:var(--egp-inicio-cache)!important;
}
</style>

<script id="egpPortadaDinamica">
(function(){

  function rgba(hex, alpha){
    hex = String(hex || '#000000').replace('#','');

    if(hex.length !== 6)
      return 'rgba(0,0,0,'+alpha+')';

    const n = parseInt(hex,16);

    return 'rgba('+
      (n>>16)+','+
      ((n>>8)&255)+','+
      (n&255)+','+
      alpha+')';
  }


  async function cargarPortada(){

    let sources = {};
    let settings = {};

    try{
      sources =
        JSON.parse(
          localStorage.getItem(
            'egm-photo-originals'
          ) || '{}'
        );

      settings =
        JSON.parse(
          localStorage.getItem(
            'egm-photo-settings'
          ) || '{}'
        );

    }catch(_){}


    const hero =
      document.querySelector('.hero');

    const overlay =
      document.querySelector('.hero-overlay');

    if(!hero) return;


    /*
     * EGP — Fotos compartidas.
     * Primero conserva localStorage como respaldo.
     * Después intenta leer la variante correcta desde Local Core.
     */
    const target =
      window.matchMedia('(max-width:700px)').matches
        ? 'mobile'
        : 'desktop';

    const variantKey='portada__'+target;

    let src =
      sources[variantKey] ||
      sources.portada ||
      '';

    let d =
      settings[variantKey] ||
      settings.portada ||
      {};

    const firebasePublicTest =
      location.hostname.endsWith('github.io');

    /*
     * WEB PUBLICA:
     * Firebase es la única fuente dinámica de la foto.
     * No pintar localStorage/Core antes de Firebase.
     */
    if(firebasePublicTest){
      return;
    }

    if(!firebasePublicTest){
      try{
        const coreHost =
          location.hostname === '127.0.0.1' ||
          location.hostname === 'localhost'
            ? '127.0.0.1'
            : location.hostname;

        const response=await fetch(
          'https://core.elenagirjoaba.com/api/photos',
          {cache:'no-store'}
        );

        if(response.ok){
          const remote=await response.json();
          const photo=remote?.photos?.[variantKey];

          if(photo && typeof photo==='object'){
            if(photo.src) src=photo.src;
            d={...d,...photo};
          }
        }
      }catch(err){
        console.warn(
          'Core de fotos no disponible; usando almacenamiento local',
          err
        );
      }
    }


    /*
     * Si todavía no se configuró:
     * conserva hero.jpg / hero-mobile.jpg.
     */

    if(src){
      hero.style.backgroundImage =
        'url("' + src + '")';
    }


    if(
      d.x !== undefined ||
      d.y !== undefined
    ){
      hero.style.backgroundPosition =
        (d.x ?? 50) + '% ' +
        (d.y ?? 50) + '%';
    }


    if(d.zoom !== undefined){
      hero.style.backgroundSize =
        Number(d.zoom) + '%';
    }


    if(overlay){

      const intensity =
        Number(d.intensity ?? 55) / 100;

      const opacity =
        Number(d.opacity ?? 70) / 100;

      const alpha =
        intensity * opacity;

      const direction =
        d.direction || 'to bottom';

      const color =
        d.color || '#000000';

      overlay.style.background =
        'linear-gradient('+
        direction+','+
        rgba(color,0)+' 0%,'+
        rgba(color,alpha)+' 100%)';
    }
  }


  document.addEventListener(
    'DOMContentLoaded',
    cargarPortada
  );


  window.addEventListener(
    'storage',
    function(e){
      if(
        e.key === 'egm-photo-originals' ||
        e.key === 'egm-photo-settings'
      ){
        cargarPortada();
      }
    }
  );

})();
</script>



<script type="module" class="egpFirebaseFotosPublicas">
(async function(){

  try{
    const mobile=
      /iPhone|iPad|iPod|Android|Mobile|Windows Phone/i
        .test(navigator.userAgent||'');

    const key='portada__'+(mobile?'mobile':'desktop');

    const [{initializeApp,getApps,getApp},{getFirestore,doc,getDoc}] =
      await Promise.all([
        import('https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js')
      ]);

    const response=await fetch(
      '../configuracion.json?fotoFirebase='+Date.now(),
      {cache:'no-store'}
    );

    const cfg=await response.json();

    const appName='egp-fotos-publicas';

    const app=getApps().some(a=>a.name===appName)
      ? getApp(appName)
      : initializeApp(cfg.firebase,appName);

    const db=getFirestore(app);

    const snap=await getDoc(
      doc(db,'imageEdits','site-photo-'+key)
    );

    if(!snap.exists()) return;

    const d=snap.data()||{};
    if(!d.src) return;

    const el=document.querySelector('.hero');
    if(!el) return;


    el.style.backgroundImage='url("'+d.src+'")';
    el.style.backgroundPosition=(d.x??50)+'% '+(d.y??50)+'%';

    if(d.zoom!==undefined){
      el.style.backgroundSize=Number(d.zoom)+'%';
    }

    const overlay=document.querySelector('.hero-overlay');

    if(overlay){
      const hex=String(d.color||'#000000').replace('#','');
      const n=parseInt(hex,16);
      const alpha=
        (Number(d.intensity??55)/100) *
        (Number(d.opacity??70)/100);

      const rgba=a =>
        'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';

      overlay.style.background=
        'linear-gradient('+
        (d.direction||'to bottom')+','+
        rgba(0)+' 0%,'+
        rgba(alpha)+' 100%)';
    }


    try{
      const cache=JSON.parse(
        localStorage.getItem('egp-firebase-photo-cache')||'{}'
      );

      cache[key]=d;

      localStorage.setItem(
        'egp-firebase-photo-cache',
        JSON.stringify(cache)
      );
    }catch(_){}

    console.log('EGP FOTO FIREBASE:',key,d.updatedAt||'');

  }catch(err){
    console.error('EGP FOTO FIREBASE ERROR',err);
  }

})();
</script>
